<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Punch Cam - Găng đấm lò xo AR</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;touch-action:none;user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  #hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;color:#fff;font-weight:800;font-size:22px;text-shadow:0 2px 6px #000;pointer-events:none}
  #status{position:fixed;top:48px;left:0;right:0;text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 4px #000;pointer-events:none}
  #flip{position:fixed;top:10px;left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:20px;border:0;background:#0008;color:#fff;font-size:14px}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;background:#111e;color:#fff;text-align:center;padding:24px}
  #start button{font-size:22px;padding:14px 36px;border:0;border-radius:14px;background:#e53935;color:#fff;font-weight:800}
  #start p{max-width:360px;line-height:1.5;margin:0;opacity:.9}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted style="display:none"></video>
<div id="hud"><span id="score">Điểm: 0</span><span id="combo"></span></div>
<div id="status"></div>
<button id="flip" style="display:none">Đổi camera</button>
<div id="start">
  <h1 style="margin:0">🥊 Punch Cam</h1>
  <p>Bật camera, hướng vào mặt bạn (hoặc con mèo/chó). Chạm nửa trái màn hình = găng đỏ đấm, nửa phải = găng xanh. Phím <b>A</b>/<b>L</b> trên máy tính.</p>
  <button id="go">Bắt đầu</button>
  <div id="err" style="color:#ff8a80"></div>
</div>

<script type="module">
import {FilesetResolver, FaceLandmarker, ObjectDetector} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const video = $('v');
let W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

let facing='user', stream=null, faceLm=null, objDet=null, audio=null;

// ---------- Camera ----------
async function startCamera(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject = stream; await video.play();
}
const mirrored = () => facing==='user';

// ---------- Mapping video -> screen (object-fit: cover) ----------
function map(){
  const vw=video.videoWidth||1, vh=video.videoHeight||1;
  const s=Math.max(W/vw,H/vh);
  return {s, ox:(W-vw*s)/2, oy:(H-vh*s)/2, vw, vh};
}
function toScreen(px,py,m){ // px,py in video pixels
  let x=px*m.s+m.ox, y=py*m.s+m.oy;
  if(mirrored()) x=W-x;
  return [x,y];
}

// ---------- Target tracking ----------
const target={ok:false,x:W/2,y:H/2,w:200,h:260,cheeks:[[0,0],[0,0]],kind:'none',lost:0};
function setTarget(box,kind,cheeks){
  const k=target.ok?0.5:1;
  target.x+=(box.x-target.x)*k; target.y+=(box.y-target.y)*k;
  target.w+=(box.w-target.w)*k; target.h+=(box.h-target.h)*k;
  target.cheeks=cheeks; target.ok=true; target.kind=kind; target.lost=0;
}
let frameNo=0, lastVT=-1;
function detect(){
  if(!faceLm||video.readyState<2||video.currentTime===lastVT) return;
  lastVT=video.currentTime; frameNo++;
  const m=map(), now=performance.now();
  let found=false;
  const r=faceLm.detectForVideo(video,now);
  if(r.faceLandmarks&&r.faceLandmarks.length){
    const lm=r.faceLandmarks[0];
    let x0=1,y0=1,x1=0,y1=0;
    for(const p of lm){if(p.x<x0)x0=p.x;if(p.x>x1)x1=p.x;if(p.y<y0)y0=p.y;if(p.y>y1)y1=p.y}
    const [ax,ay]=toScreen(x0*m.vw,y0*m.vh,m),[bx,by]=toScreen(x1*m.vw,y1*m.vh,m);
    const c=i=>toScreen(lm[i].x*m.vw,lm[i].y*m.vh,m);
    setTarget({x:(ax+bx)/2,y:(ay+by)/2,w:Math.abs(bx-ax),h:Math.abs(by-ay)},'face',[c(50),c(280)]);
    found=true;
  } else if(objDet && frameNo%3===0){
    const d=objDet.detectForVideo(video,now);
    const best=(d.detections||[]).find(o=>o.categories.some(c=>['cat','dog'].includes(c.categoryName)));
    if(best){
      const b=best.boundingBox;
      const [ax,ay]=toScreen(b.originX,b.originY,m),[bx,by]=toScreen(b.originX+b.width,b.originY+b.height,m);
      const w=Math.abs(bx-ax),h=Math.abs(by-ay),cx=(ax+bx)/2,cy=(ay+by)/2;
      // đầu thú cưng ~ nửa trên của khung
      const hw=w*0.5,hh=h*0.5,hx=cx,hy=Math.min(ay,by)+hh*0.6;
      setTarget({x:hx,y:hy,w:hw,h:hh},'pet',[[hx-hw*.3,hy+hh*.1],[hx+hw*.3,hy+hh*.1]]);
      found=true;
    }
  }
  if(!found && ++target.lost>20) target.ok=false;
}

// ---------- Game state ----------
let score=0, combo=0, comboT=0, redness=0, shake=0;
const fist=[
  {key:'l',color:'#e53935',dark:'#a31515',baseX:()=>W*0.18,restX:()=>W*0.24,t:0,state:'idle',tx:0,ty:0},
  {key:'r',color:'#2f8fdc',dark:'#16609c',baseX:()=>W*0.82,restX:()=>W*0.76,t:0,state:'idle',tx:0,ty:0},
];
let hitFx=null, popups=[];
function punch(side){
  const g=fist[side]; if(g.state!=='idle') return;
  g.state='out'; g.t=0;
  const tg=target.ok?target:{x:W/2,y:H*0.4,w:200,h:260};
  g.tx=tg.x+(Math.random()-.5)*tg.w*0.3; g.ty=tg.y+(Math.random()-.5)*tg.h*0.2;
  g.hit=target.ok;
  woosh();
}
function onHit(g,side){
  if(!g.hit) return;
  combo++; comboT=1.5; score+=10*Math.min(combo,10);
  redness=Math.min(1,redness+0.25); shake=14;
  hitFx={t:0,dir:side===0?1:-1,x:g.tx,y:g.ty};
  popups.push({x:g.tx,y:g.ty-40,t:0,txt:['BỐP!','POW!','BÙM!','CHÁT!'][Math.random()*4|0]});
  thump();
  if(navigator.vibrate) navigator.vibrate(40);
  $('score').textContent='Điểm: '+score;
}
function press(x){punch(x<W/2?0:1)}
cv.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();press(e.clientX)});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='a'||k==='arrowleft')punch(0);if(k==='l'||k==='arrowright')punch(1);if(k===' ')punch(Math.random()<.5?0:1)});

// ---------- Audio (synth) ----------
function audioInit(){if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)()} if(audio.state==='suspended')audio.resume()}
function woosh(){if(!audio)return;const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(500,t);o.frequency.exponentialRampToValueAtTime(150,t+.12);
  g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.15)}
function thump(){if(!audio)return;const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();
  o.type='sine';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(40,t+.2);
  g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.3);
  const n=audio.createBufferSource(),b=audio.createBuffer(1,audio.sampleRate*.08,audio.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const ng=audio.createGain();ng.gain.value=.5;n.buffer=b;n.connect(ng).connect(audio.destination);n.start(t)}

// ---------- Drawing ----------
const ease=t=>1-Math.pow(1-t,3);
function drawSpring(x0,y0,x1,y1,s,color){
  const dx=x1-x0,dy=y1-y0,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,coils=12,amp=13*s;
  ctx.save();ctx.lineWidth=5*s;ctx.lineJoin='round';ctx.strokeStyle=color;ctx.beginPath();ctx.moveTo(x0,y0);
  for(let i=1;i<=coils*2;i++){const f=i/(coils*2),sg=i%2?1:-1;ctx.lineTo(x0+dx*f+nx*amp*sg,y0+dy*f+ny*amp*sg)}
  ctx.lineTo(x1,y1);ctx.stroke();ctx.restore();
}
function drawGlove(x,y,ang,s,g){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang+Math.PI/2);ctx.scale(s,s);
  // cuff (ở dưới, phía lò xo)
  ctx.fillStyle='#3a3f9e';ctx.fillRect(-34,40,68,50);
  ctx.fillStyle='#ff4f7a';for(let i=0;i<5;i++)ctx.fillRect(-34+i*14,40,7,50);
  ctx.fillStyle='#ffd23f';star(0,58,13);
  // fist
  const gr=ctx.createLinearGradient(-50,-70,50,50);gr.addColorStop(0,lighten(g.color));gr.addColorStop(1,g.dark);
  ctx.fillStyle=gr;ctx.strokeStyle='#0004';ctx.lineWidth=3;
  ctx.beginPath();ctx.ellipse(0,-12,48,62,0,0,7);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(-44,6,18,30,.3,0,7);ctx.fill();ctx.stroke(); // ngón cái
  ctx.strokeStyle='#0003';ctx.lineWidth=3;
  for(const dx of[-16,0,16]){ctx.beginPath();ctx.moveTo(dx,-70);ctx.quadraticCurveTo(dx+3,-45,dx,-30);ctx.stroke()}
  ctx.fillStyle='#fff4';ctx.beginPath();ctx.ellipse(14,-38,14,26,.3,0,7);ctx.fill();
  ctx.restore();
}
function lighten(c){return c==='#e53935'?'#ff8a80':'#8fd0ff'}
function star(cx,cy,r){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;ctx.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}ctx.closePath();ctx.fill()}

const tmp=document.createElement('canvas'),tctx=tmp.getContext('2d');
function drawVideo(){
  const m=map();ctx.save();
  if(mirrored()){ctx.translate(W,0);ctx.scale(-1,1)}
  ctx.drawImage(video,m.ox,m.oy,m.vw*m.s,m.vh*m.s);ctx.restore();
}
function drawWarp(dt){
  if(!hitFx||!target.ok) return;
  hitFx.t+=dt/0.45; if(hitFx.t>=1){hitFx=null;return}
  const k=Math.sin(hitFx.t*Math.PI)*Math.exp(-hitFx.t*1.5);
  const rw=target.w*1.5,rh=target.h*1.5,rx=target.x-rw/2,ry=target.y-rh/2;
  const sx=Math.max(0,rx),sy=Math.max(0,ry),sw=Math.min(W-sx,rw),sh=Math.min(H-sy,rh);
  if(sw<8||sh<8) return;
  tmp.width=sw*DPR;tmp.height=sh*DPR;
  tctx.drawImage(cv,sx*DPR,sy*DPR,sw*DPR,sh*DPR,0,0,tmp.width,tmp.height);
  ctx.save();
  ctx.beginPath();ctx.ellipse(target.x,target.y,target.w*.62,target.h*.62,0,0,7);ctx.clip();
  ctx.translate(target.x+hitFx.dir*k*target.w*0.35,target.y);
  ctx.rotate(hitFx.dir*k*0.25);
  ctx.scale(1-k*0.38,1+k*0.12);
  ctx.translate(-target.x,-target.y);
  ctx.drawImage(tmp,sx,sy,sw,sh);
  ctx.restore();
}
function drawCheeks(){
  if(!target.ok||redness<=0.01) return;
  for(const [x,y] of target.cheeks){
    const r=target.w*0.2,g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,`rgba(255,40,70,${redness*.65})`);g.addColorStop(1,'rgba(255,40,70,0)');
    ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);
  }
}
function drawGloves(dt){
  fist.forEach((g,i)=>{
    const bx=g.baseX(),by=H+30,rx=g.restX(),ry=H*0.80;
    let px=rx,py=ry,sc=1;
    if(g.state==='out'){g.t+=dt/0.10;const f=ease(Math.min(g.t,1));px=rx+(g.tx-rx)*f;py=ry+(g.ty-ry)*f;sc=1-0.45*f;
      if(g.t>=1){g.state='back';g.t=0;onHit(g,i)}}
    else if(g.state==='back'){g.t+=dt/0.32;const f=ease(Math.min(g.t,1)),e=1-f;
      px=rx+(g.tx-rx)*e;py=ry+(g.ty-ry)*e;sc=1-0.45*e;
      // dao động lò xo khi về
      const w=Math.sin(g.t*14)*(1-f)*18;py+=w;if(g.t>=1)g.state='idle'}
    const ang=Math.atan2(py-by,px-bx);
    drawSpring(bx,by,px-Math.cos(ang)*70*sc,py-Math.sin(ang)*70*sc+20*sc,sc,'#9aa0aa');
    drawGlove(px,py,ang,sc*(W<500?.9:1.15),g);
  });
}

let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,.05);last=now;
  detect();
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0.3){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=0.85}
  drawVideo();drawWarp(dt);drawCheeks();drawGloves(dt);
  for(const p of popups){p.t+=dt;const a=1-p.t/.7;if(a<=0)continue;
    ctx.save();ctx.globalAlpha=a;ctx.font='900 '+(54+p.t*40)+'px system-ui';ctx.textAlign='center';
    ctx.lineWidth=8;ctx.strokeStyle='#000';ctx.fillStyle='#ffe135';
    ctx.strokeText(p.txt,p.x,p.y-p.t*80);ctx.fillText(p.txt,p.x,p.y-p.t*80);ctx.restore()}
  popups=popups.filter(p=>p.t<.7);
  ctx.restore();
  redness=Math.max(0,redness-dt*0.12);
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0}
  $('combo').textContent=combo>1?`Combo x${combo}`:'';
  $('status').textContent=target.ok?(target.kind==='face'?'':'Đã thấy thú cưng 🐱'):'Đưa mặt (hoặc mèo/chó) vào khung hình...';
}

// ---------- Boot ----------
$('go').onclick=async()=>{
  $('go').disabled=true;$('go').textContent='Đang tải...';audioInit();
  try{
    await startCamera();
    const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    faceLm=await FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate:"GPU"},runningMode:"VIDEO",numFaces:1});
    ObjectDetector.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite",delegate:"GPU"},runningMode:"VIDEO",scoreThreshold:.3,maxResults:5}).then(o=>objDet=o).catch(()=>{});
    $('start').style.display='none';$('flip').style.display='block';
    requestAnimationFrame(loop);
  }catch(e){$('err').textContent='Lỗi: '+e.message+' (cần cấp quyền camera và chạy qua http://localhost hoặc https)';$('go').disabled=false;$('go').textContent='Thử lại'}
};
$('flip').onclick=async e=>{e.stopPropagation();facing=facing==='user'?'environment':'user';target.ok=false;await startCamera()};
$('flip').addEventListener('pointerdown',e=>e.stopPropagation());
</script>
</body>
</html>
